<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Switchboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0906; --amber: #ffb547; --amber-hi: #ffd08a; --dim: #9a7a48; --faint: #3b2f1d; --line: #2a2116;
    --red: #ff5b4d; --green: #9be37a;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg); }
  body {
    font: 13px/1.45 'JetBrains Mono', ui-monospace, monospace; color: var(--amber); background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  body::after { /* scanlines + glow */
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px),
                radial-gradient(ellipse at 50% 0%, rgba(255,181,71,.07), transparent 60%);
  }
  .glow { text-shadow: 0 0 6px rgba(255,181,71,.35); }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .prompt { font-weight: 800; letter-spacing: .02em; }
  .prompt .u { color: var(--dim); font-weight: 400; }
  .cursor { display: inline-block; width: .6em; height: 1.05em; background: var(--amber); vertical-align: -2px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .sub { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .btn {
    font: inherit; font-weight: 700; font-size: 12px; color: var(--bg); background: var(--amber); border: 0; padding: 6px 9px;
    box-shadow: 0 0 12px rgba(255,181,71,.35); white-space: nowrap;
  }
  .counts { margin: 14px 0 6px; padding: 8px 0; border-top: 1px dashed var(--faint); border-bottom: 1px dashed var(--faint);
    display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; }
  .counts b { color: var(--amber-hi); font-weight: 800; }
  .counts .bad b, .counts .bad { color: var(--red); text-shadow: 0 0 6px rgba(255,91,77,.4); }
  section { margin-top: 16px; }
  .sh { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 12px; letter-spacing: .06em; cursor: pointer; user-select: none; }
  .sh .rule { flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--faint) 0 4px, transparent 4px 7px); }
  .sh .n { color: var(--dim); }
  .sh .car { width: 1ch; display: inline-block; transition: transform .15s; }
  .collapsed .car { transform: rotate(-90deg); }
  .collapsed .body { display: none; }
  .card { display: grid; grid-template-columns: 5.2ch 1fr; gap: 0 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .t { color: var(--dim); font-size: 11px; padding-top: 1px; }
  .from { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; color: var(--amber-hi); }
  .subj { color: var(--amber); font-weight: 500; }
  .snip { color: var(--dim); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
  .tags { margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; }
  .tag { border: 1px solid var(--faint); padding: 0 5px; color: var(--amber); }
  .tag.cat { color: var(--amber-hi); }
  .tag.dl::before { content: 'DUE '; color: var(--dim); }
  .tag.overdue { background: var(--red); color: #160604; border-color: var(--red); font-weight: 800; }
  .tag.overdue::before { content: ''; }
  .tag.code { color: var(--green); border-color: #355c27; }
  .card.is-overdue .subj { color: var(--red); }
  .card.is-overdue .t { color: var(--red); }
  .junk .card { grid-template-columns: 5.2ch 1fr; padding: 5px 0; }
  .foot { margin-top: 22px; color: var(--faint); font-size: 11px; text-align: center; }
</style>
</head>
<body>
<header>
  <div>
    <div class="prompt glow"><span class="u">kasen@</span>inbox<span class="u">:~$</span> triage <span class="cursor"></span></div>
    <div class="sub" id="sync"></div>
  </div>
  <button class="btn">[↻ SYNC]</button>
</header>
<div class="counts glow" id="counts"></div>
<main id="list"></main>
<div class="foot">── end of buffer ──</div>
<script src="mock.js"></script>
<script>
  const M = MOCK, c = M.counts();
  document.getElementById('sync').textContent = `last sync ${M.refreshedAgo()} · 60d window`;
  document.getElementById('counts').innerHTML =
    `<span><b>${c.action}</b> need action</span><span><b>${c.week}</b> due ≤7d</span><span class="bad"><b>${c.overdue}</b> OVERDUE</span>`;
  const catAbbr = { school: 'SCH', work: 'WRK', family: 'FAM', other: 'OTH' };
  const hhmm = (t) => {
    const a = M.ago(t);
    return /m$|h$/.test(a) ? `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}` : a.replace('Yesterday', 'YDAY').toUpperCase();
  };
  document.getElementById('list').innerHTML = M.grouped().map((s, i) => `
    <section data-section class="${s.collapsed ? 'collapsed' : ''} ${s.id}">
      <div class="sh glow" data-toggle><span class="car">▾</span>0${i + 1} ${M.esc(s.name.toUpperCase())}<span class="rule"></span><span class="n">[${s.items.length}]</span></div>
      <div class="body">${s.items.map((e) => {
        const dl = M.deadline(e), code = M.codeLeft(e);
        return `<div class="card ${dl && dl.overdue ? 'is-overdue' : ''}">
          <div class="t">${hhmm(e.date)}</div>
          <div>
            <div class="from"><span>${M.esc(e.from)}</span></div>
            <div class="subj">${M.esc(e.subject)}</div>
            ${s.id === 'junk' ? '' : `<div class="snip">${M.esc(e.snippet)}</div>
            <div class="tags"><span class="tag cat">${catAbbr[e.cat]}</span>${e.kind ? `<span class="tag">${e.kind === 'reply' ? '↩ REPLY' : '! ACTION'}</span>` : ''}${dl ? `<span class="tag dl ${dl.overdue ? 'overdue' : ''}">${M.esc(dl.label.toUpperCase())}</span>` : ''}${code !== null ? `<span class="tag code">CODE · ${code}m LEFT</span>` : ''}</div>`}
          </div></div>`;
      }).join('')}</div>
    </section>`).join('');
  M.wireToggles();
</script>
</body>
</html>
