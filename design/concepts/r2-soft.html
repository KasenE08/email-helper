<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #131417; --card: #1c1d22; --card2: #24262c; --text: #eceef2; --muted: #9296a0; --faint: #5d6069; --red: #ff7a72;
    --school: #a9c4ff; --work: #f0c58e; --family: #b6e3c0; --other: #b3b6bf; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); }
  body { color: var(--text); font: 15px/1.45 'Manrope', system-ui, sans-serif; padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 32px); -webkit-font-smoothing: antialiased; }
  header { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: 13px; }
  .refresh { border: 0; background: var(--card2); color: var(--text); font: 600 14px 'Manrope'; padding: 10px 16px; border-radius: 999px; }
  .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .count { background: var(--card); border-radius: 16px; padding: 12px 14px; }
  .count b { display: block; font-size: 22px; font-weight: 800; line-height: 1.1; }
  .count span { color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .count.bad { background: rgba(255,122,114,.12); }
  .count.bad b, .count.bad span { color: var(--red); }
  section { margin-top: 24px; }
  .sh { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; padding: 0 4px 10px; }
  .sh h2 { font-size: 16px; font-weight: 700; }
  .sh .n { background: var(--card2); color: var(--muted); font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; }
  .sh .car { margin-left: auto; color: var(--faint); transition: transform .15s; }
  .collapsed .car { transform: rotate(-90deg); }
  .collapsed .body { display: none; }
  .body { display: grid; gap: 8px; }
  .card { background: var(--card); border-radius: 18px; padding: 14px 16px; }
  .r1 { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 500; }
  .subj { font-size: 15.5px; font-weight: 700; margin-top: 2px; letter-spacing: -.01em; }
  .snip { font-size: 14px; color: var(--muted); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { display: flex; gap: 6px; margin-top: 10px; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--card2); color: var(--muted); }
  .tag.cat { color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
  .tag.due { color: var(--text); }
  .card.overdue { box-shadow: inset 0 0 0 1.5px var(--red); }
  .card.overdue .tag.due { color: var(--red); background: rgba(255,122,114,.12); }
  .junk .card { padding: 10px 16px; border-radius: 14px; }
  .junk .subj { font-size: 14px; font-weight: 500; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div><h1>Inbox</h1><div class="sub" id="ref"></div></div>
  <button class="refresh">↻ Refresh</button>
</header>
<div class="counts" id="counts"></div>
<main id="list"></main>
<script src="mock.js"></script>
<script>
  const M = MOCK, c = M.counts();
  document.getElementById('ref').textContent = `Refreshed ${M.refreshedAgo()}`;
  document.getElementById('counts').innerHTML = `
    <div class="count"><b>${c.action}</b><span>Need action</span></div>
    <div class="count"><b>${c.week}</b><span>Due this week</span></div>
    <div class="count ${c.overdue ? 'bad' : ''}"><b>${c.overdue}</b><span>Overdue</span></div>`;
  document.getElementById('list').innerHTML = M.grouped().map((s) => `
    <section data-section class="${s.collapsed ? 'collapsed' : ''} ${s.id}">
      <div class="sh" data-toggle><h2>${M.esc(s.name)}</h2><span class="n">${s.items.length}</span><span class="car">▾</span></div>
      <div class="body">${s.items.map((e) => {
        const dl = M.deadline(e), code = M.codeLeft(e);
        if (s.id === 'junk') return `<div class="card"><div class="r1"><span>${M.esc(e.from)}</span><span>${M.ago(e.date)}</span></div><div class="subj">${M.esc(e.subject)}</div></div>`;
        return `<div class="card ${dl && dl.overdue ? 'overdue' : ''}">
          <div class="r1"><span>${M.esc(e.from)}</span><span>${M.ago(e.date)}</span></div>
          <div class="subj">${M.esc(e.subject)}</div>
          <div class="snip">${M.esc(e.snippet)}</div>
          <div class="tags"><span class="tag cat" style="--c:var(--${e.cat})">${M.CATS[e.cat]}</span>${dl ? `<span class="tag due">${dl.overdue ? '' : 'Due '}${M.esc(dl.label)}</span>` : code !== null ? `<span class="tag due">Code · ${code} min left</span>` : ''}</div>
        </div>`;
      }).join('')}</div>
    </section>`).join('');
  M.wireToggles();
</script>
</body>
</html>
