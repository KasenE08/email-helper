<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Broadsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14120f; --ink: #eee6d6; --muted: #a0968a; --faint: #6b6358; --rule: #3a342c;
    --gold: #d8b46a; --red: #ff6450;
    --serif: 'Fraunces', Georgia, serif; --body: 'Newsreader', Georgia, serif; --label: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); }
  body { color: var(--ink); font-family: var(--body); padding: calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 28px); -webkit-font-smoothing: antialiased; }
  .lbl { font-family: var(--label); font-weight: 600; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; }
  .mast-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
  .refresh { font-family: var(--label); font-weight: 600; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--bg); background: var(--ink); border: 0; padding: 6px 10px 5px; border-radius: 0; }
  h1 { font-family: var(--serif); font-weight: 900; font-size: 50px; line-height: 1; letter-spacing: -.02em; text-align: center; margin: 10px 0 8px; font-variation-settings: 'opsz' 144; }
  h1 em { font-style: normal; color: var(--gold); }
  .rules { border-top: 3px double var(--ink); border-bottom: 1px solid var(--ink); padding: 6px 0 5px; display: flex; justify-content: space-between; color: var(--muted); }
  .edition { margin: 14px 0 4px; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .edition div + div { border-left: 1px solid var(--rule); }
  .edition b { display: block; font-family: var(--serif); font-weight: 700; font-size: 30px; line-height: 1.05; }
  .edition .bad b, .edition .bad .lbl { color: var(--red); }
  .edition .lbl { color: var(--muted); font-size: 9.5px; }
  section { margin-top: 22px; }
  .sh { display: flex; align-items: baseline; gap: 10px; cursor: pointer; user-select: none; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
  .sh h2 { font-family: var(--serif); font-weight: 700; font-size: 21px; font-style: italic; letter-spacing: -.01em; }
  .sh .n { margin-left: auto; color: var(--muted); }
  .sh .car { font-family: var(--label); color: var(--muted); font-size: 12px; transition: transform .15s; }
  .collapsed .car { transform: rotate(-90deg); }
  .collapsed .body { display: none; }
  .story { padding: 12px 0 13px; border-bottom: 1px solid var(--rule); position: relative; }
  .byline { display: flex; justify-content: space-between; color: var(--gold); }
  .byline .ago { color: var(--faint); }
  .hed { font-family: var(--serif); font-weight: 500; font-size: 19px; line-height: 1.18; margin: 4px 0 4px; letter-spacing: -.005em; font-variation-settings: 'opsz' 36; }
  .lead .hed { font-size: 25px; font-weight: 700; }
  .dek { font-size: 15px; line-height: 1.38; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .lead .dek { font-style: italic; }
  .meta { margin-top: 7px; display: flex; gap: 6px; align-items: center; color: var(--muted); flex-wrap: wrap; }
  .meta .sep { color: var(--faint); }
  .meta .due { color: var(--ink); }
  .story.overdue { padding-left: 12px; }
  .story.overdue::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 13px; width: 3px; background: var(--red); }
  .story.overdue .due { color: var(--red); }
  .junk .story { padding: 7px 0; }
  .junk .hed { font-size: 15px; margin: 0; }
  .colophon { text-align: center; color: var(--faint); margin-top: 24px; }
</style>
</head>
<body>
<div class="mast-top lbl"><span id="date"></span><button class="refresh">↻ Refresh</button></div>
<h1>The <em>Inbox</em></h1>
<div class="rules lbl"><span>Kasen’s Edition</span><span id="ref"></span></div>
<div class="edition" id="counts"></div>
<main id="list"></main>
<div class="colophon lbl">— 30 —</div>
<script src="mock.js"></script>
<script>
  const M = MOCK, c = M.counts();
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('date').textContent = `${DAYS[M.NOW.getDay()]}, ${M.MON[M.NOW.getMonth()]} ${M.NOW.getDate()}`;
  document.getElementById('ref').textContent = `Refreshed ${M.refreshedAgo()}`;
  document.getElementById('counts').innerHTML =
    `<div><b>${c.action}</b><span class="lbl">Need action</span></div><div><b>${c.week}</b><span class="lbl">Due this week</span></div><div class="bad"><b>${c.overdue}</b><span class="lbl">Overdue</span></div>`;
  document.getElementById('list').innerHTML = M.grouped().map((s) => `
    <section data-section class="${s.collapsed ? 'collapsed' : ''} ${s.id}">
      <div class="sh" data-toggle><h2>${M.esc(s.name)}</h2><span class="n lbl">${s.items.length} ${s.items.length === 1 ? 'item' : 'items'}</span><span class="car">▼</span></div>
      <div class="body">${s.items.map((e, i) => {
        const dl = M.deadline(e), code = M.codeLeft(e);
        const lead = s.id === 'action' && i === 0;
        if (s.id === 'junk') return `<article class="story"><div class="byline lbl"><span>${M.esc(e.from)}</span><span class="ago">${M.ago(e.date)}</span></div><div class="hed">${M.esc(e.subject)}</div></article>`;
        return `<article class="story ${lead ? 'lead' : ''} ${dl && dl.overdue ? 'overdue' : ''}">
          <div class="byline lbl"><span>${M.esc(e.from)}</span><span class="ago">${M.ago(e.date)}</span></div>
          <h3 class="hed">${M.esc(e.subject)}</h3>
          <p class="dek">${M.esc(e.snippet)}</p>
          <div class="meta lbl"><span>${M.CATS[e.cat]}</span>
            ${e.kind ? `<span class="sep">/</span><span>${e.kind === 'reply' ? 'Reply owed' : 'Action'}</span>` : ''}
            ${dl ? `<span class="sep">/</span><span class="due">${dl.overdue ? '' : 'Due '}${M.esc(dl.label)}</span>` : ''}
            ${code !== null ? `<span class="sep">/</span><span class="due">Code · ${code} min left</span>` : ''}
          </div></article>`;
      }).join('')}</div>
    </section>`).join('');
  M.wireToggles();
</script>
</body>
</html>
